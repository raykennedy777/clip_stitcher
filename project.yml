name: ClipStitcher

options:
  bundleIdPrefix: io.github.raykennedy777
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    # Signing lives in Config/Signing.xcconfig (portable ad-hoc default + optional local
    # override) so a fresh clone builds with no Apple account or certificate.
  configs:
    Debug:
      # Hardened runtime enforces Library Validation: under the self-signed "ClipStitcher Dev"
      # cert (Team ID "not set") the test host refuses to load the xctest bundle and the
      # Xcode debug dylib ("different Team IDs"), so `xcodebuild test` aborts at launch. Dev
      # builds need neither (no notarization); Release still gets hardened runtime from base.
      # The .app stays signed with the stable cert, so the TCC grant (issue: dev-signing) holds.
      ENABLE_HARDENED_RUNTIME: NO
      ENABLE_DEBUG_DYLIB: NO

targets:
  ClipStitcher:
    type: application
    platform: macOS
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_NAME: ClipStitcher
        PRODUCT_BUNDLE_IDENTIFIER: io.github.raykennedy777.clipstitcher
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.video"
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Generated/Info.plist
      properties:
        CFBundleName: Clip Stitcher
        CFBundleDisplayName: Clip Stitcher
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "Copyright © 2026 raykennedy777"
        CFBundleDocumentTypes:
          - CFBundleTypeName: Clip Stitcher Project
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - io.github.raykennedy777.clipstitcher.project
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: io.github.raykennedy777.clipstitcher.project
            UTTypeDescription: Clip Stitcher Project
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - clipstitcher

  clipstitch:
    type: tool
    platform: macOS
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      # The headless CLI (issue #105, ADR-0025) reuses the app's engine layer as-is:
      # Models + Services compile into both targets, so the CLI can never stitch
      # differently than the app. GUI layers (App/Views/CutEditor/Preview) stay out;
      # FrameExtractor is the one Services file with a GUI-side dependency
      # (FrameStreamDecoder, AppKit) and nothing on the export path uses it.
      - path: Sources/Models
      - path: Sources/Services
        excludes:
          - FrameExtractor.swift
      - path: CLI
    settings:
      base:
        PRODUCT_NAME: clipstitch

  ClipStitcherTests:
    type: bundle.unit-test
    platform: macOS
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - path: Tests
        excludes:
          # The gitignored media fixtures (ADR-0023) must never be copied into the test
          # bundle as resources: tests locate them via #filePath, and a multi-GB cached
          # slice would otherwise be re-copied on every test build.
          - "Fixtures/**"
    dependencies:
      - target: ClipStitcher
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.raykennedy777.clipstitcher.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  clipstitch:
    build:
      targets:
        clipstitch: all
    run:
      config: Debug

  ClipStitcher:
    build:
      targets:
        ClipStitcher: all
        ClipStitcherTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ClipStitcherTests
    archive:
      config: Release
