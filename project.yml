name: VidConform

options:
  bundleIdPrefix: com.conmotogroup
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES

targets:
  VidConform:
    type: application
    platform: macOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_NAME: VidConform
        PRODUCT_BUNDLE_IDENTIFIER: com.conmotogroup.vidconform
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.video"
        COMBINE_HIDPI_IMAGES: YES
    info:
      path: Generated/Info.plist
      properties:
        CFBundleName: VidConform
        CFBundleDisplayName: VidConform
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "Copyright © 2026 Conmoto Group. All rights reserved."
        CFBundleDocumentTypes:
          - CFBundleTypeName: VidConform Project
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.conmotogroup.vidconform.project
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.conmotogroup.vidconform.project
            UTTypeDescription: VidConform Project
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - vidconform

  VidConformTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: VidConform
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.conmotogroup.vidconform.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  VidConform:
    build:
      targets:
        VidConform: all
        VidConformTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - VidConformTests
    archive:
      config: Release
